services:
  mysql-db:
    image: mysql:8.0
    container_name: veterinaria_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: veterinaria_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  api:
    build:
      context: ./API
      dockerfile: src/Veterinaria.API/Dockerfile
    container_name: veterinaria_api
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - mysql-db
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: veterinaria_frontend
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data: