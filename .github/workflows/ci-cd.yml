name: Integración y despliegue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Pruebas
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --configuration Release --no-restore

      - name: Ejecutar las pruebas
        run: dotnet test --configuration Release --no-build --verbosity normal

  # ------------------------------------------------------- Construir imagen
  imagen:
    name: Construir y publicar la imagen
    runs-on: ubuntu-latest
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Calcular el nombre de la imagen
        id: nombre
        run: |
          echo "imagen=ghcr.io/$(echo '${{ github.repository }}' \
                | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Preparar buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.nombre.outputs.imagen }}:latest
            ${{ steps.nombre.outputs.imagen }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------- Desplegar
  desplegar:
    name: Desplegar en el servidor
    runs-on: ubuntu-latest
    needs: imagen
    if: vars.DEPLOY_ENABLED == 'true'

    environment: produccion

    steps:
      - name: Configurar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Descargar la imagen nueva y reiniciar
        run: |
          TARGET_APP="${{ vars.PROJECT_NAME }}"
          if [ -z "$TARGET_APP" ]; then
            TARGET_APP="${{ github.event.repository.name }}"
          fi
          ssh -i ~/.ssh/id_ed25519 \
              "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" \
              "/usr/local/bin/desplegar.sh $TARGET_APP"

      - name: Comprobar que el sitio responde
        run: |
          curl --fail --silent --show-error \
               --retry 6 --retry-delay 5 --retry-all-errors \
               "https://${{ vars.DOMAIN }}/api/health"